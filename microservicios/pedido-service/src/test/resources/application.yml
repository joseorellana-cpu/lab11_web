# Pruebas automaticas con H2 en memoria (no necesitan MySQL)
spring:
  application:
    name: pedido-service
  datasource:
    url: jdbc:h2:mem:bd_pedido_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
empresa:
  ambiente: pruebas
