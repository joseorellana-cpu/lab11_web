spring:
  application:
    # Nombre con el que se registra en Eureka (los demas servicios lo buscan asi)
    name: producto-service
  profiles:
    active: dev

# Registro en el servidor Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
