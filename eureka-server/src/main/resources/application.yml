server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # El servidor no se registra a si mismo ni descarga el registro
    register-with-eureka: false
    fetch-registry: false
  server:
    # En desarrollo: los servicios detenidos desaparecen rapido del registro
    enable-self-preservation: false
